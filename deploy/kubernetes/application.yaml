apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawler-poc
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: crawler-api}
  template:
    metadata:
      labels: {app: crawler-api}
    spec:
      serviceAccountName: crawler-poc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: REPLACE_WITH_REGISTRY/crawler-poc@sha256:REPLACE_WITH_DIGEST
          command: [crawler]
          args: [serve, --host, "0.0.0.0"]
          ports: [{containerPort: 8000}]
          env:
            - name: CRAWLER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: crawler-config, key: database-url}}
            - name: CRAWLER_API_KEY
              valueFrom: {secretKeyRef: {name: crawler-config, key: api-key}}
            - name: CRAWLER_OBJECT_URI
              valueFrom: {secretKeyRef: {name: crawler-config, key: object-uri}}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /app/var}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: temporary, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-api
spec:
  type: ClusterIP
  selector: {app: crawler-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: crawler-worker}
  template:
    metadata:
      labels: {app: crawler-worker}
    spec:
      serviceAccountName: crawler-poc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: REPLACE_WITH_REGISTRY/crawler-poc@sha256:REPLACE_WITH_DIGEST
          command: [crawler]
          args: [worker]
          env:
            - name: CRAWLER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: crawler-config, key: database-url}}
            - name: CRAWLER_OBJECT_URI
              valueFrom: {secretKeyRef: {name: crawler-config, key: object-uri}}
          resources:
            requests: {cpu: "250m", memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: temporary, emptyDir: {}}

