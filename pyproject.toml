[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-poc"
version = "0.1.0"
description = "Bounded, safe URL metadata and local topic extraction with lakehouse integrations."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "fastapi>=0.115,<1",
  "lxml>=5,<7",
  "protego>=0.4,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "trafilatura>=2,<3",
  "uvicorn>=0.34,<1",
  "yake>=0.6,<1",
]

[project.optional-dependencies]
data = [
  "pyarrow>=20,<24",
  "pyiceberg[pyarrow,sql-sqlite]>=0.10,<0.12",
  "google-cloud-bigquery>=3.30,<4",
  "google-cloud-storage>=3,<4",
  "trino>=0.330,<1",
  "pymysql>=1.1.1,<2",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "psutil>=6,<8",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.15,<1",
  "types-lxml>=2025",
  "pyyaml>=6,<7",
]
nlp = ["keybert>=0.9,<1"]
browser = ["playwright>=1.56,<2"]

[project.scripts]
crawler = "crawler_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crawler_poc = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "cloud: requires explicitly authorized real remote resources",
  "browser: requires an explicitly enabled, installed browser runtime",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

